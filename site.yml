---
- name: Resolve runtime inputs and connection details
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: preflight
    - role: vault_auth
    - role: resolve_connection

- name: Generate ephemeral root SSH key on the runner when needed
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: generate_ephemeral_root_key
      when: ansible_user != 'root'

- name: Bootstrap ephemeral root SSH access when needed
  hosts: runtime_targets
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: bootstrap_root_ssh
      when: hostvars['localhost'].ansible_user != 'root'

- name: Promote root execution targets
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: promote_root_connection

- name: Prepare hosts, install Splunk UF, configure, and validate
  hosts: runtime_execution_targets
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  pre_tasks:
    - name: Gather facts without privilege escalation
      ansible.builtin.setup:
      become: false

  roles:
    - role: prepare_hosts
      become: false
    - role: splunk_install
      become: false
    - role: splunk_config
      become: false
    - role: splunk_validate
      become: false

- name: Clean up ephemeral root SSH access when used
  hosts: runtime_execution_targets
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: cleanup_root_ssh
      when: hostvars['localhost'].ansible_user != 'root'

- name: Clean up local ephemeral key material
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: cleanup_local_ephemeral_key
      when: ansible_user != 'root'

- name: Summarize execution
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: execution_summary
