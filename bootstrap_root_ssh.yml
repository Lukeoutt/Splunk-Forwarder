---
- name: Resolve runtime inputs and connection details for bootstrap
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: preflight
    - role: vault_auth
    - role: resolve_connection

- name: Bootstrap root SSH authorized key
  hosts: runtime_targets
  gather_facts: false
  vars_files:
    - defaults/main.yml
    - group_vars/all.yml

  roles:
    - role: bootstrap_root_ssh
