---
- name: Initialize execution summary list
  ansible.builtin.set_fact:
    execution_summary_hosts: []

- name: Append per-host execution status
  ansible.builtin.set_fact:
    execution_summary_hosts: "{{ execution_summary_hosts + [summary_item] }}"
  vars:
    summary_item:
      host: "{{ item }}"
      install_status: "{{ hostvars[item].splunk_install_status | default({'status': 'not-reported'}) }}"
      config_status: "{{ hostvars[item].splunk_config_status | default({'status': 'not-reported'}) }}"
      validation_status: "{{ hostvars[item].splunk_validation_status | default({'status': 'not-reported'}) }}"
  loop: "{{ groups['runtime_targets'] | default([]) }}"

- name: Emit compact execution summary
  ansible.builtin.debug:
    msg:
      processed_hosts: "{{ groups['runtime_targets'] | default([]) }}"
      results: "{{ execution_summary_hosts }}"
